<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basi — Convertitore di basi numeriche</title>
  <meta name="description" content="Converti numeri tra basi diverse (binario, ottale, decimale, esadecimale e tutte le basi da 2 a 16) con i passaggi spiegati, e allenati con esercizi casuali.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b4cca'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='18' text-anchor='middle' fill='%23fff'%3Eb%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="top">
      <header class="masthead">
        <h1>Basi</h1>
        <p>Converti numeri tra basi diverse, allenati e fai i calcoli nella stessa base, con tutti i passaggi.</p>
      </header>

      <div class="tabs" role="tablist" aria-label="Modalità">
        <button class="tab" role="tab" id="tab-convert" aria-controls="panel-convert" aria-selected="true">Converti</button>
        <button class="tab" role="tab" id="tab-train" aria-controls="panel-train" aria-selected="false" tabindex="-1">Allenamento</button>
        <button class="tab" role="tab" id="tab-ops" aria-controls="panel-ops" aria-selected="false" tabindex="-1">Operazioni</button>
      </div>
    </div>

    <!-- Convertitore -->
    <section class="panel" id="panel-convert" role="tabpanel" aria-labelledby="tab-convert">
      <div class="card bar">
        <label class="field wide">
          <span class="label">Numero</span>
          <input id="c-input" class="input mono" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" placeholder="es. 101101 · −45 · 12,75">
        </label>
        <label class="field">
          <span class="label">Da base</span>
          <span class="select"><select id="c-from"></select></span>
        </label>
        <button id="c-swap" class="icon-btn" type="button" aria-label="Scambia le basi" title="Scambia le basi">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg>
        </button>
        <label class="field">
          <span class="label">A base</span>
          <span class="select"><select id="c-to"></select></span>
        </label>
        <div id="c-opts" class="opts">
          <label id="c-signed-wrap" class="check">
            <input id="c-signed" type="checkbox">
            <span>Il numero binario è in complemento a 2</span>
          </label>
          <label id="c-bits-wrap" class="inline-field" hidden>
            <span>Complemento a 2 su</span>
            <span class="select small">
              <select id="c-bits">
                <option value="auto">bit automatici</option>
                <option value="8">8 bit</option>
                <option value="16">16 bit</option>
                <option value="32">32 bit</option>
              </select>
            </span>
          </label>
        </div>
        <p id="c-error" class="error" role="alert" hidden></p>
      </div>

      <div class="hero" aria-live="polite">
        <span class="label">Risultato</span>
        <div class="hero-row">
          <output id="c-output" class="hero-value mono">—</output>
          <button id="c-copy" class="ghost-btn" type="button" hidden>Copia</button>
        </div>
      </div>

      <details id="c-steps" class="steps" hidden>
        <summary>Mostra i passaggi</summary>
        <div class="steps-body" id="c-steps-body"></div>
      </details>
    </section>

    <!-- Allenamento -->
    <section class="panel" id="panel-train" role="tabpanel" aria-labelledby="tab-train" hidden>
      <div class="card bar train-bar">
        <label class="field kind">
          <span class="label">Esercizio</span>
          <span class="select">
            <select id="t-kind">
              <option value="conv">Conversioni</option>
              <option value="op">Operazioni</option>
            </select>
          </span>
        </label>
        <label class="field" data-kind="conv">
          <span class="label">Da base</span>
          <span class="select"><select id="t-from"></select></span>
        </label>
        <label class="field" data-kind="conv">
          <span class="label">A base</span>
          <span class="select"><select id="t-to"></select></span>
        </label>
        <label class="field" data-kind="op" hidden>
          <span class="label">Base</span>
          <span class="select"><select id="t-base"></select></span>
        </label>
        <label class="field" data-kind="op" hidden>
          <span class="label">Operazione</span>
          <span class="select">
            <select id="t-op">
              <option value="random">Casuale</option>
              <option value="+">+ somma</option>
              <option value="-">− sottrazione</option>
              <option value="*">× moltiplicazione</option>
              <option value="/">÷ divisione</option>
            </select>
          </span>
        </label>
        <label class="field">
          <span class="label">Difficoltà</span>
          <span class="select">
            <select id="t-level">
              <option value="easy">Facile</option>
              <option value="medium" selected>Media</option>
              <option value="hard">Difficile</option>
            </select>
          </span>
        </label>
        <div class="field stat">
          <span class="label">Corrette</span>
          <span id="t-score" class="stat-value mono">0 / 0</span>
        </div>
        <div class="opts">
          <label class="check">
            <input id="t-neg" type="checkbox">
            <span>Numeri negativi</span>
          </label>
          <label class="check">
            <input id="t-frac" type="checkbox">
            <span>Numeri con la virgola</span>
          </label>
        </div>
      </div>

      <div class="duo">
        <div class="hero">
          <span class="label" id="t-prompt">Converti in base 10</span>
          <div id="t-number" class="hero-value mono"></div>
          <p id="t-note" class="hero-note" hidden></p>
        </div>

        <form id="t-form" class="card answer" autocomplete="off">
          <label class="field">
            <span class="label">La tua risposta</span>
            <input id="t-answer" class="input mono" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="80" placeholder="Scrivi il risultato">
          </label>
          <div class="actions">
            <button id="t-check" class="btn primary" type="submit">Verifica</button>
            <button id="t-new" class="btn" type="button">Nuovo numero</button>
          </div>
        </form>
      </div>

      <div id="t-feedback" class="feedback" aria-live="polite" hidden></div>

      <details id="t-steps" class="steps" hidden>
        <summary>Soluzione con i passaggi</summary>
        <div class="steps-body" id="t-steps-body"></div>
      </details>
    </section>

    <!-- Operazioni -->
    <section class="panel" id="panel-ops" role="tabpanel" aria-labelledby="tab-ops" hidden>
      <div class="card bar ops-bar">
        <label class="field first">
          <span class="label">Primo numero</span>
          <input id="o-a" class="input mono" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="es. 1011">
        </label>
        <label class="field">
          <span class="label">Operazione</span>
          <span class="select">
            <select id="o-op" class="mono" aria-label="Operazione">
              <option value="+">+</option>
              <option value="-">−</option>
              <option value="*">×</option>
              <option value="/">÷</option>
            </select>
          </span>
        </label>
        <label class="field">
          <span class="label">Secondo numero</span>
          <input id="o-b" class="input mono" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="es. 110">
        </label>
        <label class="field last">
          <span class="label">Base</span>
          <span class="select"><select id="o-base"></select></span>
        </label>
        <p id="o-error" class="error" role="alert" hidden></p>
      </div>

      <div class="hero" aria-live="polite">
        <span class="label">Risultato</span>
        <div class="hero-row">
          <output id="o-output" class="hero-value mono">—</output>
          <button id="o-copy" class="ghost-btn" type="button" hidden>Copia</button>
        </div>
      </div>

      <details id="o-steps" class="steps" hidden>
        <summary>Mostra i passaggi</summary>
        <div class="steps-body" id="o-steps-body"></div>
      </details>
    </section>

    <footer class="foot">Numeri interi e con la virgola, positivi e negativi · basi da 2 a 16</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
